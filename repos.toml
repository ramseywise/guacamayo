# The repos guacamayo governs — the one list. Read by `src/telemetry/repos.py`;
# bash reads it through `uv run telemetry --list-repos` so nothing parses TOML twice.
#
#   role        platform | product | job-search | retiring
#   visibility  public | private — a private repo's findings stay in .sounding/
#   path        local clone; a missing clone is reported as `not cloned`, never skipped
#   review      include in the portfolio sweep's code-review pass
#
# Adding a repo here adds it to the board, hygiene, and the sweep at once.

[repos.guacamayo]
role = "platform"
visibility = "public"
path = "~/workspace/guacamayo"
review = true

[repos.galactus]
role = "platform"
visibility = "public"
path = "~/workspace/galactus"
review = true

