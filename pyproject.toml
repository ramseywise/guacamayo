[project]
name = "guacamayo"
version = "0.1.0"
description = "Review pipeline backbone + workflow telemetry"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "click>=8.0", "claude-agent-sdk>=0.0.13", "structlog>=26.1.0"]

[project.scripts]
review-cli = "review.cli:main"
telemetry = "telemetry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review", "telemetry"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLW1510"]
# Vendored/moved from librarian (GUA-93) — kept byte-diffable against the originals
# until Phase 5 deletes them; rule deltas are ignored rather than edited in place.
"telemetry/**" = ["ISC004", "BLE001"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]
